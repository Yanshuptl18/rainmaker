[project]
name = "screening-graph"
version = "0.1.0"
description = "Take-home: build a screening graph from Indian exchange filings"
requires-python = ">=3.11"
dependencies = [
    "graphiti-core[falkordb]>=0.30",
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.scripts]
screening-graph = "screening_graph.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screening_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
ignore = ["BLE001", "DTZ007"]

